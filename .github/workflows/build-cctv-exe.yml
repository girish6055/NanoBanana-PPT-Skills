name: Build CCTV Analytics Manager (Windows exe)

on:
  workflow_dispatch:
  push:
    branches: ["claude/cctv-analytics-exe-controls-w1ayu8"]
    paths:
      - "cctv_analytics/**"
      - "cctv_analytics_app.py"
      - "CCTVAnalyticsManager.spec"
      - ".github/workflows/build-cctv-exe.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the configuration engine
        run: python cctv_analytics_app.py --selftest

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build the executable
        run: python -m PyInstaller --clean --noconfirm CCTVAnalyticsManager.spec

      - name: Smoke-test the executable
        run: |
          .\dist\CCTVAnalyticsManager.exe --version
          .\dist\CCTVAnalyticsManager.exe --selftest

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: CCTVAnalyticsManager-windows-exe
          path: dist/CCTVAnalyticsManager.exe
          if-no-files-found: error
